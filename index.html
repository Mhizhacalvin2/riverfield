<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5d7a">
<title>RiverField</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f1f5f7;color:#16222a;padding-bottom:70px}
header{background:#0b5d7a;color:#fff;padding:12px 14px;font-weight:700;position:sticky;top:0;z-index:5}
header small{font-weight:400;opacity:.8;margin-left:6px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ccd6db;z-index:5}
nav button{flex:1;padding:14px 4px;border:0;background:none;font-size:15px;font-weight:600;color:#556}
nav button.on{color:#0b5d7a;border-top:3px solid #0b5d7a}
section{display:none;padding:12px}section.on{display:block}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;font-size:16px;border:1px solid #b9c6cc;border-radius:8px;background:#fff}
textarea{min-height:70px}
.row{display:flex;gap:8px}.row>*{flex:1}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:12px 4px;border:2px solid #b9c6cc;background:#fff;border-radius:8px;font-size:14px;font-weight:600}
.seg button.on{background:#0b5d7a;color:#fff;border-color:#0b5d7a}
.seg button.on.bad{background:#c62828;border-color:#c62828}
.seg button.on.good{background:#2e7d32;border-color:#2e7d32}
.gps{background:#e3f2f7;border-radius:8px;padding:10px;margin-top:12px;font-size:14px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:8px;background:#0b5d7a;color:#fff;font-size:16px;font-weight:700;margin-top:14px}
.btn.alt{background:#fff;color:#0b5d7a;border:2px solid #0b5d7a}
.btn.del{background:#c62828}
#prev{max-width:100%;border-radius:8px;margin-top:8px;display:none}
.card{background:#fff;border-radius:10px;padding:10px;margin-bottom:10px;display:flex;gap:10px;border-left:6px solid #888}
.card.Blocked{border-color:#c62828}.card.Unblocked{border-color:#2e7d32}
.card img{width:70px;height:70px;object-fit:cover;border-radius:6px;background:#dde}
.card b{display:block}.card small{color:#556}
.tag{display:inline-block;font-size:11px;background:#dde7ec;border-radius:4px;padding:1px 6px;margin-right:4px}
#msg{position:fixed;top:56px;left:10px;right:10px;background:#16222a;color:#fff;padding:10px;border-radius:8px;display:none;z-index:9;text-align:center}
</style>
</head>
<body>
<header>RiverField <small id="st">offline-ready</small></header>
<div id="msg"></div>

<section id="s-add" class="on">
  <label>Point type</label>
  <div class="seg" id="typeSeg">
    <button data-v="Blockage" class="on">Blockage</button>
    <button data-v="Abstraction">Abstraction</button>
    <button data-v="Gauging station">Gauging stn</button>
  </div>

  <label>Name</label>
  <input id="name" placeholder="e.g. Blockage 3 – Sand pit near bridge">

  <label>Status</label>
  <div class="seg" id="statSeg">
    <button data-v="Blocked" class="bad">Blocked</button>
    <button data-v="Unblocked" class="good on">Unblocked</button>
  </div>

  <div id="causeBox">
    <label>Cause (blockages)</label>
    <select id="cause"><option>Illegal miners</option><option>Legal miners</option><option>Unknown</option><option>Natural</option></select>
  </div>

  <label>Brief explanation</label>
  <textarea id="notes" placeholder="What you see, extent, who, severity..."></textarea>

  <label>Flow / discharge</label>
  <div class="row">
    <input id="q" type="number" step="any" inputmode="decimal" placeholder="Value">
    <select id="unit"><option>m³/s</option><option>L/s</option><option>m³/day</option><option>Ml/day</option><option>m (stage)</option></select>
  </div>
  <select id="method" style="margin-top:8px"><option>Not measured</option><option>Measured (current meter)</option><option>Gauge reading</option><option>Estimated</option><option>Float method</option></select>

  <label>Photo</label>
  <input id="photo" type="file" accept="image/*" capture="environment">
  <img id="prev" alt="">

  <div class="gps" id="gps">Getting GPS…</div>
  <div class="row" style="margin-top:8px">
    <div><label>Latitude</label><input id="lat" type="number" step="any" inputmode="decimal"></div>
    <div><label>Longitude</label><input id="lon" type="number" step="any" inputmode="decimal"></div>
  </div>
  <button class="btn alt" id="regps">Refresh GPS</button>
  <button class="btn" id="save">Save point</button>
  <button class="btn alt" id="cancel" style="display:none">Cancel edit</button>
</section>

<section id="s-list">
  <div id="count" style="font-size:13px;margin-bottom:8px"></div>
  <div id="list"></div>
</section>

<section id="s-exp">
  <p>Exports one ZIP with <b>points.csv</b>, <b>points.geojson</b> (open in QGIS) and a <b>photos/</b> folder.</p>
  <button class="btn" id="exZip">Export ZIP</button>
  <button class="btn alt" id="exCsv">Export CSV only</button>
  <p style="font-size:13px;color:#556">Data is stored on this phone (IndexedDB). Export at the end of each day as a backup.</p>
</section>

<nav>
  <button data-s="add" class="on">Add</button>
  <button data-s="list">Records</button>
  <button data-s="exp">Export</button>
</nav>

<script>
const $=id=>document.getElementById(id);
const msg=t=>{const m=$('msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2500)};

// ---------- DB ----------
let db;
const req=indexedDB.open('riverfield',1);
req.onupgradeneeded=e=>e.target.result.createObjectStore('pts',{keyPath:'id',autoIncrement:true});
req.onsuccess=e=>{db=e.target.result;render()};
const tx=m=>db.transaction('pts',m).objectStore('pts');
const all=()=>new Promise(r=>{tx('readonly').getAll().onsuccess=e=>r(e.target.result)});
const put=o=>new Promise(r=>{tx('readwrite').put(o).onsuccess=()=>r()});
const del=id=>new Promise(r=>{tx('readwrite').delete(id).onsuccess=()=>r()});

// ---------- nav / segments ----------
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+b.dataset.s));
  if(b.dataset.s==='list')render();
});
function seg(id){const c=$(id);c.querySelectorAll('button').forEach(b=>b.onclick=()=>{c.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(id==='typeSeg')$('causeBox').style.display=b.dataset.v==='Blockage'?'block':'none'})}
seg('typeSeg');seg('statSeg');
const val=id=>document.querySelector('#'+id+' .on').dataset.v;
const setSeg=(id,v)=>document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));

// ---------- GPS ----------
let fix=null,wid=null;
function startGPS(){
  if(!navigator.geolocation){$('gps').textContent='GPS not supported';return}
  if(wid!==null)navigator.geolocation.clearWatch(wid);
  fix=null;$('gps').textContent='Getting GPS…';
  wid=navigator.geolocation.watchPosition(p=>{
    if(!fix||p.coords.accuracy<=fix.acc){fix={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy}}
    $('gps').innerHTML='GPS accuracy: <b>±'+p.coords.accuracy.toFixed(1)+' m</b> (best ±'+fix.acc.toFixed(1)+' m)';
    if(!editId||$('lat').dataset.auto==='1'){$('lat').value=fix.lat.toFixed(6);$('lon').value=fix.lon.toFixed(6);$('lat').dataset.auto='1'}
  },e=>{$('gps').textContent='GPS error: '+e.message+' (you can type coordinates)'},{enableHighAccuracy:true,maximumAge:0,timeout:30000});
}
$('regps').onclick=()=>{$('lat').dataset.auto='1';startGPS()};
['lat','lon'].forEach(i=>$(i).oninput=()=>{$('lat').dataset.auto='0'});
startGPS();

// ---------- photo ----------
let photoBlob=null;
$('photo').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const bmp=await createImageBitmap(f);
  const s=Math.min(1,1280/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=bmp.width*s;c.height=bmp.height*s;
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  photoBlob=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));
  $('prev').src=URL.createObjectURL(photoBlob);$('prev').style.display='block';
};

// ---------- save ----------
let editId=null;
$('save').onclick=async()=>{
  const name=$('name').value.trim(),lat=parseFloat($('lat').value),lon=parseFloat($('lon').value);
  if(!name)return msg('Enter a name');
  if(isNaN(lat)||isNaN(lon))return msg('No coordinates yet');
  const rec={type:val('typeSeg'),name,status:val('statSeg'),cause:val('typeSeg')==='Blockage'?$('cause').value:'',
    notes:$('notes').value.trim(),q:$('q').value,unit:$('unit').value,method:$('method').value,
    lat,lon,acc:fix?+fix.acc.toFixed(1):'',time:new Date().toISOString(),photo:photoBlob};
  if(editId){rec.id=editId;const old=(await all()).find(x=>x.id===editId);rec.time=old.time;if(!photoBlob)rec.photo=old.photo}
  await put(rec);msg('Saved ✔');resetForm();
};
function resetForm(){
  editId=null;photoBlob=null;
  ['name','notes','q','photo'].forEach(i=>$(i).value='');
  $('prev').style.display='none';$('method').selectedIndex=0;
  $('cancel').style.display='none';$('save').textContent='Save point';
  $('lat').dataset.auto='1';startGPS();
}
$('cancel').onclick=resetForm;

// ---------- list ----------
async function render(){
  if(!db)return;
  const a=(await all()).reverse();
  $('count').textContent=a.length+' points • '+a.filter(x=>x.type==='Blockage').length+' blockages • '+a.filter(x=>x.type==='Abstraction').length+' abstractions • '+a.filter(x=>x.type==='Gauging station').length+' stations';
  $('list').innerHTML='';
  a.forEach(r=>{
    const d=document.createElement('div');d.className='card '+r.status;
    const img=r.photo?URL.createObjectURL(r.photo):'';
    d.innerHTML=`<img ${img?`src="${img}"`:''}><div style="flex:1"><b></b><span class="tag">${r.type}</span><span class="tag">${r.status}</span>${r.cause?`<span class="tag">${r.cause}</span>`:''}<br><small>${r.q?r.q+' '+r.unit+' • ':''}${r.lat.toFixed(5)}, ${r.lon.toFixed(5)}</small></div>`;
    d.querySelector('b').textContent=r.name;
    d.onclick=()=>edit(r);
    $('list').appendChild(d);
  });
}
function edit(r){
  document.querySelector('nav [data-s=add]').click();
  editId=r.id;photoBlob=null;
  setSeg('typeSeg',r.type);setSeg('statSeg',r.status);
  $('causeBox').style.display=r.type==='Blockage'?'block':'none';
  $('name').value=r.name;$('notes').value=r.notes;$('q').value=r.q;$('unit').value=r.unit;$('method').value=r.method;
  if(r.cause)$('cause').value=r.cause;
  $('lat').value=r.lat;$('lon').value=r.lon;$('lat').dataset.auto='0';
  if(r.photo){$('prev').src=URL.createObjectURL(r.photo);$('prev').style.display='block'}else $('prev').style.display='none';
  $('save').textContent='Update point';$('cancel').style.display='block';
  if(!$('delBtn')){const b=document.createElement('button');b.id='delBtn';b.className='btn del';b.textContent='Delete point';
    b.onclick=async()=>{if(confirm('Delete this point?')){await del(editId);resetForm();msg('Deleted')}};
    $('cancel').after(b)}
  $('delBtn').style.display='block';
}
const _reset=resetForm;resetForm=function(){_reset();if($('delBtn'))$('delBtn').style.display='none'};

// ---------- export ----------
const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
const slug=s=>s.replace(/[^a-z0-9]+/gi,'_').slice(0,30);
const pname=r=>r.photo?`photos/${r.id}_${slug(r.name)}.jpg`:'';
function csv(a){
  const h=['id','type','name','status','cause','explanation','discharge','unit','method','latitude','longitude','gps_accuracy_m','time','photo'];
  return [h.join(',')].concat(a.map(r=>[r.id,r.type,r.name,r.status,r.cause,r.notes,r.q,r.unit,r.method,r.lat,r.lon,r.acc,r.time,pname(r)].map(esc).join(','))).join('\n');
}
function geojson(a){
  return JSON.stringify({type:'FeatureCollection',features:a.map(r=>({type:'Feature',geometry:{type:'Point',coordinates:[r.lon,r.lat]},
    properties:{id:r.id,type:r.type,name:r.name,status:r.status,cause:r.cause,explanation:r.notes,discharge:r.q===''?null:+r.q,unit:r.unit,method:r.method,gps_accuracy_m:r.acc,time:r.time,photo:pname(r)}}))},null,1);
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
const stamp=()=>new Date().toISOString().slice(0,10);
$('exCsv').onclick=async()=>{const a=await all();if(!a.length)return msg('No data');dl(new Blob([csv(a)],{type:'text/csv'}),'river_points_'+stamp()+'.csv')};
$('exZip').onclick=async()=>{
  const a=await all();if(!a.length)return msg('No data');
  const enc=new TextEncoder(),files=[{name:'points.csv',data:enc.encode(csv(a))},{name:'points.geojson',data:enc.encode(geojson(a))}];
  for(const r of a)if(r.photo)files.push({name:pname(r),data:new Uint8Array(await r.photo.arrayBuffer())});
  dl(zip(files),'river_survey_'+stamp()+'.zip');msg('ZIP exported');
};
// store-only ZIP writer
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=~0;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return ~c>>>0};
function zip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const d=new Date(),dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const n=enc.encode(f.name),c=crc32(f.data),s=f.data.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
    h.setUint32(14,c,true);h.setUint32(18,s,true);h.setUint32(22,s,true);h.setUint16(26,n.length,true);
    parts.push(h.buffer,n,f.data);
    const e=new DataView(new ArrayBuffer(46));
    e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint16(12,dt,true);e.setUint16(14,dd,true);
    e.setUint32(16,c,true);e.setUint32(20,s,true);e.setUint32(24,s,true);e.setUint16(28,n.length,true);e.setUint32(42,off,true);
    cd.push(e.buffer,n);off+=30+n.length+s;
  }
  const cs=cd.reduce((a,b)=>a+b.byteLength,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,end.buffer],{type:'application/zip'});
}

// ---------- PWA ----------
const icon="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#0b5d7a"/><path d="M96 300q80-80 160 0t160 0v60q-80 80-160 0t-160 0z" fill="#fff"/><circle cx="256" cy="170" r="50" fill="#ffca28"/></svg>');
const man={name:'RiverField',short_name:'RiverField',start_url:location.href.split('#')[0],display:'standalone',background_color:'#0b5d7a',theme_color:'#0b5d7a',icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any'}]};
const ml=document.createElement('link');ml.rel='manifest';ml.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.appendChild(ml);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').then(()=>{$('st').textContent='offline-ready'}).catch(()=>{$('st').textContent='open via https to enable offline'});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
</script>
</body>
</html>
